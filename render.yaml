# render.yaml – Render Blueprint (Infrastructure as Code)
# Docs: https://docs.render.com/blueprint-spec

services:
  - type: web
    name: campusbooks
    runtime: python
    region: oregon
    plan: free
    rootDir: campusbooks
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    envVars:
      - key: MONGO_URI
        sync: false        # you'll set this manually in the Render dashboard
      - key: DB_NAME
        value: campusbooks
      - key: PYTHON_VERSION
        value: "3.12.0"
